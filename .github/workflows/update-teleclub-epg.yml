name: Actualizar EPG TeleclubTV

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-teleclub-epg.yml"
      - "teleclub-epg/update_epg.py"
      - "teleclub-epg/add_radio_la_zona.py"
      - "teleclub-epg/seed_channels.tsv"

permissions:
  contents: write

concurrency:
  group: teleclub-epg-auto
  cancel-in-progress: false

jobs:
  actualizar-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar EPG automática desde el panel
        shell: bash
        run: |
          set -e
          mkdir -p teleclub-epg
          tmp="$(mktemp)"
          EPG_URL='https://teleclubtv-panel.micanalfmradio8.workers.dev/epg.xml'
          if curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 120 \
            -H 'User-Agent: TeleclubTV-EPG-GitHub/1.1' \
            "$EPG_URL" -o "$tmp"; then
            if grep -q '<tv' "$tmp" && grep -q '<channel ' "$tmp"; then
              mv "$tmp" teleclub-epg/guia_teleclubtv.xml
              echo "EPG descargada desde $EPG_URL"
            else
              echo "La respuesta del Worker no parece XMLTV válido"
              rm -f "$tmp"
              python teleclub-epg/update_epg.py
            fi
          else
            echo "No se pudo descargar la EPG del Worker; usando generador local de respaldo"
            rm -f "$tmp"
            python teleclub-epg/update_epg.py
          fi

      - name: Agregar EPG de Radio La Zona
        run: |
          python teleclub-epg/add_radio_la_zona.py

      - name: Validar guía antes de publicar
        run: |
          test -s teleclub-epg/guia_teleclubtv.xml
          grep -q '<channel ' teleclub-epg/guia_teleclubtv.xml
          grep -q 'channel id="custom-28"' teleclub-epg/guia_teleclubtv.xml
          grep -q 'channel="custom-28"' teleclub-epg/guia_teleclubtv.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          p='teleclub-epg/guia_teleclubtv.xml'
          root=ET.parse(p).getroot()
          channels=len(root.findall('channel'))
          programmes=len(root.findall('programme'))
          radio_programmes=sum(1 for p in root.findall('programme') if p.attrib.get('channel')=='custom-28')
          print(f'EPG válida: {channels} canales, {programmes} programas; Radio La Zona={radio_programmes}')
          if channels < 1 or radio_programmes < 1:
              raise SystemExit('EPG inválida o sin Radio La Zona; no se publicará')
          PY

      - name: Guardar guía actualizada
        run: |
          git config user.name "teleclub-epg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add teleclub-epg/guia_teleclubtv.xml
          if git diff --cached --quiet; then
            echo "La guía no cambió"
          else
            git commit -m "Actualizar guía EPG TeleclubTV"
            git push
          fi

