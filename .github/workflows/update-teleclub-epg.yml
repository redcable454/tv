name: Actualizar EPG TeleclubTV

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-teleclub-epg.yml"
      - "teleclub-epg/update_epg.py"
      - "teleclub-epg/add_sports_epg.py"
      - "teleclub-epg/add_radio_la_zona.py"
      - "teleclub-epg/add_radio_inolvidable.py"
      - "teleclub-epg/add_radio_programming_extra.py"
      - "teleclub-epg/add_all_panel_channels.py"
      - "teleclub-epg/enrich_missing_epg.py"
      - "teleclub-epg/seed_channels.tsv"
      - "teleclubtv_con_epg.m3u"

permissions:
  contents: write

concurrency:
  group: teleclub-epg-auto
  cancel-in-progress: false

jobs:
  actualizar-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar EPG automática desde el panel
        shell: bash
        run: |
          set -e
          mkdir -p teleclub-epg
          tmp="$(mktemp)"
          EPG_URL='https://teleclubtv-panel.micanalfmradio8.workers.dev/epg.xml'
          if curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 120 -H 'User-Agent: TeleclubTV-EPG-GitHub/1.1' "$EPG_URL" -o "$tmp"; then
            if grep -q '<tv' "$tmp" && grep -q '<channel ' "$tmp"; then mv "$tmp" teleclub-epg/guia_teleclubtv.xml; else rm -f "$tmp"; python teleclub-epg/update_epg.py; fi
          else rm -f "$tmp"; python teleclub-epg/update_epg.py; fi
      - name: Agregar programación detallada de Radio La Zona
        run: python teleclub-epg/add_radio_la_zona.py
      - name: Sincronizar todos los canales y radios activos del panel
        run: python teleclub-epg/add_all_panel_channels.py
      - name: Completar canales sin EPG real desde fuente secundaria
        run: python teleclub-epg/enrich_missing_epg.py
      - name: Agregar EPG deportiva Liga1 Liga Max y Ovación TV
        run: python teleclub-epg/add_sports_epg.py
      - name: Agregar programación real de Radio La Inolvidable
        run: python teleclub-epg/add_radio_inolvidable.py
      - name: Agregar EPG de Felicidad Oxigeno Corazon Disney Studio92 y Planeta
        run: python teleclub-epg/add_radio_programming_extra.py
      - name: Validar guía antes de publicar
        run: |
          test -s teleclub-epg/guia_teleclubtv.xml
          grep -q '<channel ' teleclub-epg/guia_teleclubtv.xml
          grep -q '<programme ' teleclub-epg/guia_teleclubtv.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('teleclub-epg/guia_teleclubtv.xml').getroot()
          channels=len(root.findall('channel')); programmes=len(root.findall('programme'))
          with_programmes={p.attrib.get('channel') for p in root.findall('programme')}
          targets = {'movistar.lch7217', 'movistar.lch7216'}
          missing=[ch.attrib.get('id') for ch in root.findall('channel') if ch.attrib.get('id') not in with_programmes and ch.attrib.get('id') not in targets]
          import json
          # Un canal cuenta como genérico solo si TODOS sus programas son
          # marcadores genéricos "- en vivo". Si tiene al menos un programa
          # detallado, se clasifica como EPG real/disponible.
          programmes_by_channel={}
          for p in root.findall('programme'):
              cid=p.attrib.get('channel')
              if cid:
                  programmes_by_channel.setdefault(cid, []).append(p)
          # Validación explícita de los dos tvg-id que consume Teleclub TV.
          from datetime import datetime, timezone
          targets = {'movistar.lch7217': 'L1', 'movistar.lch7216': 'L1 MAX'}
          now = datetime.now(timezone.utc)
          for cid, name in targets.items():
              items = programmes_by_channel.get(cid, [])
              upcoming = 0
              for p in items:
                  try:
                      stop = datetime.strptime(p.attrib['stop'], '%Y%m%d%H%M%S %z').astimezone(timezone.utc)
                      if stop > now:
                          upcoming += 1
                  except (KeyError, ValueError):
                      pass
              print(f'Validación EPG {name} ({cid}): {len(items)} programas, {upcoming} vigentes/futuros')
              # Mientras no esté conectada la fuente de programación original del usuario,
              # es preferible dejar L1/L1 MAX sin parrilla antes que publicar datos inventados.
              if items and not upcoming:
                  raise SystemExit(f'ERROR: {name} tiene programas, pero ninguno vigente/futuro')
              if not items:
                  print(f'AVISO: {name} queda sin parrilla hasta recuperar la programación original de Teleclub')
          generic=set()
          for cid, items in programmes_by_channel.items():
              titles=[(p.findtext('title') or '').strip().lower() for p in items]
              if titles and all(title.endswith(' - en vivo') for title in titles):
                  generic.add(cid)
          real=sorted(x for x in with_programmes if x and x not in generic)
          status={
              'channels': channels,
              'programmes': programmes,
              'channels_with_programmes': len(with_programmes),
              'real_epg_channels': len(real),
              'generic_epg_channels': len(generic),
              'missing_epg_channels': len(missing),
              'generic_channel_ids': sorted(x for x in generic if x),
              'generic_channels': sorted(
                  [
                      {
                          'id': ch.attrib.get('id',''),
                          'name': (ch.findtext('display-name') or '').strip(),
                      }
                      for ch in root.findall('channel')
                      if ch.attrib.get('id') in generic
                  ],
                  key=lambda x: (x['name'].lower(), x['id'])
              ),
              'missing_channel_ids': missing,
          }
          with open('teleclub-epg/epg-status.json','w',encoding='utf-8') as fh:
              json.dump(status,fh,ensure_ascii=False,indent=2)
              fh.write('\\n')
          print(f'EPG válida: {channels} canales/radios, {programmes} programas; real={len(real)}, generica={len(generic)}, sin_programacion={len(missing)}')
          if channels < 1 or programmes < 1 or missing: raise SystemExit(f'EPG incompleta: {missing[:20]}')
          PY
      - name: Guardar guía actualizada
        run: |
          git config user.name "teleclub-epg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add teleclub-epg/guia_teleclubtv.xml teleclub-epg/epg-status.json
          if git diff --cached --quiet; then
            echo "La guía no cambió"
          else
            git commit -m "Actualizar guía EPG TeleclubTV"
            # La guía se genera desde fuentes externas y puede cambiar en cada ejecución.
            # Si otra ejecución publica al mismo tiempo, conservar los archivos EPG
            # generados por esta ejecución al rebasar y volver a intentar la publicación.
            git pull --rebase -X theirs origin main
            git push
          fi

# Forzar regeneración EPG deportes 2026-08-29
