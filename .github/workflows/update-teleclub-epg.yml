name: Actualizar EPG TeleclubTV

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "teleclub-epg/update_epg.py"
      - "teleclub-epg/seed_channels.tsv"
      - ".github/workflows/update-teleclub-epg.yml"

permissions:
  contents: write

jobs:
  actualizar-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar guía XMLTV
        run: python teleclub-epg/update_epg.py

      - name: Guardar guía actualizada
        run: |
          git config user.name "teleclub-epg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add teleclub-epg/guia_teleclubtv.xml
          if git diff --cached --quiet; then
            echo "La guía no cambió"
          else
            git commit -m "Actualizar guía EPG TeleclubTV"
            git push
          fi
